<g class="v0"><text class="t" x="16.0" y="64" textLength="504.0" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#8b949e"># A site made with AI over a weekend. Is it OK to publish?</tspan></text><g class="k2" transform="translate(487.2,0)"><rect x="32.8" y="50" width="693.2" height="20" fill="#0d1117"/><rect class="c1" x="32.8" y="52" width="8.4" height="16" fill="#e6edf3" opacity="0"/></g></g>
<g class="v3"><text class="t" x="16.0" y="84" textLength="344.4" xml:space="preserve"><tspan fill="#3fb950">$ </tspan>python3 site_check.py my-site --summary</text><g class="k5" transform="translate(327.6,0)"><rect x="32.8" y="70" width="693.2" height="20" fill="#0d1117"/><rect class="c4" x="32.8" y="72" width="8.4" height="16" fill="#e6edf3" opacity="0"/></g></g>
<g class="v6"><text class="t" x="16.0" y="104" textLength="159.6" xml:space="preserve">site check: my-site</text></g>
<g class="v7"></g>
<g class="v8"><text class="t" x="16.0" y="144" textLength="336.0" xml:space="preserve">Score: 39/100    Verdict: DO NOT PUBLISH</text></g>
<g class="v9"><text class="t" x="16.0" y="164" textLength="688.8" xml:space="preserve">(39 of 100 points. A checklist of common problems, not a judgement of the design.)</text></g>
<g class="v10"></g>
<g class="v11"><text class="t" x="32.8" y="204" textLength="218.4" xml:space="preserve">Safe to publish      15/30</text></g>
<g class="v12"><text class="t" x="32.8" y="224" textLength="218.4" xml:space="preserve">Everything works      7/25</text></g>
<g class="v13"><text class="t" x="32.8" y="244" textLength="218.4" xml:space="preserve">Fits a phone          3/10</text></g>
<g class="v14"><text class="t" x="32.8" y="264" textLength="218.4" xml:space="preserve">Real content          8/15</text></g>
<g class="v15"><text class="t" x="32.8" y="284" textLength="218.4" xml:space="preserve">Found and shared      1/12</text></g>
<g class="v16"><text class="t" x="32.8" y="304" textLength="210.0" xml:space="preserve">Easy and fast         5/8 </text></g>
<g class="v17"></g>
<g class="v18"><text class="t" x="16.0" y="344" textLength="680.4" xml:space="preserve">STOP. Something in these files must not go online. Fix that before anything else.</text></g>
<g class="v19"><text class="t" x="16.0" y="364" textLength="310.8" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#8b949e"># What to fix, most important first</tspan></text><g class="k21" transform="translate(294.0,0)"><rect x="32.8" y="350" width="693.2" height="20" fill="#0d1117"/><rect class="c20" x="32.8" y="352" width="8.4" height="16" fill="#e6edf3" opacity="0"/></g></g>
<g class="v22"><text class="t" x="16.0" y="384" textLength="394.8" xml:space="preserve"><tspan fill="#3fb950">$ </tspan>python3 site_check.py my-site | grep '^[0-9]'</text><g class="k24" transform="translate(378.0,0)"><rect x="32.8" y="370" width="693.2" height="20" fill="#0d1117"/><rect class="c23" x="32.8" y="372" width="8.4" height="16" fill="#e6edf3" opacity="0"/></g></g>
<g class="v25"><text class="t" x="16.0" y="404" textLength="336.0" xml:space="preserve">1. Secret keys  (+15)  &lt;-- do this first</text></g>
<g class="v26"><text class="t" x="16.0" y="424" textLength="344.4" xml:space="preserve">2. Titles, description and sharing  (+11)</text></g>
<g class="v27"><text class="t" x="16.0" y="444" textLength="285.6" xml:space="preserve">3. Broken links and pictures  (+8)</text></g>
<g class="v28"><text class="t" x="16.0" y="464" textLength="176.4" xml:space="preserve">4. Phone layout  (+7)</text></g>
<g class="v29"><text class="t" x="16.0" y="484" textLength="319.2" xml:space="preserve">5. Placeholder text and pictures  (+7)</text></g>
<g class="v30"><text class="t" x="16.0" y="504" textLength="117.6" xml:space="preserve">6. Forms  (+4)</text></g>
<g class="v31"><text class="t" x="16.0" y="524" textLength="420.0" xml:space="preserve">7. Addresses that only work on this computer  (+3)</text></g>
<g class="v32"><text class="t" x="16.0" y="544" textLength="352.8" xml:space="preserve">8. Links and buttons that do nothing  (+3)</text></g>
<g class="v33"><text class="t" x="16.0" y="564" textLength="193.2" xml:space="preserve">9. Heavy pictures  (+2)</text></g>
<g class="v34"><text class="t" x="16.0" y="584" textLength="277.2" xml:space="preserve">10. Descriptions and labels  (+1)</text></g>
