<!doctype html>
<!--
  vibe-coding-website-builder page skeleton. Copy it for every page, then replace everything in
  CAPITALS. It carries the lines that are easy to forget and that the check
  looks for. The design is yours to make: nothing here decides how the page looks.
-->
<html lang="en"><!-- the language the page is written in: en, es, fr, de, ar (add dir="rtl"), ... -->
<head>
  <meta charset="utf-8">
  <!-- Without this line a phone shows the page tiny, as if it were a desktop screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Browser tab and the blue line in search results. Different on every page, under about 60 characters. -->
  <title>WHAT THIS PAGE IS - NAME OF THE SITE</title>
  <!-- The grey text under the blue line in search results. One or two plain sentences. -->
  <meta name="description" content="WHO THIS IS, WHAT THEY OFFER, WHERE.">

  <!-- The small picture in the browser tab. An SVG file is enough. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- What a chat or social app shows when someone shares the link. The picture should be a
       JPEG or PNG about 1200 x 630 (apps do not show SVG). Once the site has its real address,
       og:image and og:url must be full addresses that start with https:// -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="NAME OF THE SITE, OR THIS PAGE'S HEADLINE">
  <meta property="og:description" content="THE SAME ONE OR TWO SENTENCES AS ABOVE.">
  <meta property="og:image" content="images/share.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Addresses have no leading slash, so the page also works when opened by double-click. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <!-- Site name and a few links. The same on every page. -->
  </header>

  <main id="main">
    <h1>ONE MAIN HEADING PER PAGE</h1>

    <!-- A yellow note marks something only the owner knows. It shows on the page, so the owner
         sees exactly what is missing, and the check counts every one that is left. -->
    <p>Call us on <mark class="needs-you">your phone number</mark></p>

    <!-- The same for a picture that has not arrived yet. -->
    <div class="needs-you needs-you-photo">Photo: the front of the shop, wide</div>
  </main>

  <footer>
    <!-- Name, contact details, and whatever the owner's country requires (see references/build.md). -->
  </footer>
</body>
</html>

<!--
  Put these rules in style.css. Keep them as they are: the yellow notes should
  look out of place on purpose, whatever the rest of the design is.

  .needs-you {
    background: #ffe45c;
    color: #1a1a1a;
    outline: 2px dashed #a37b00;
    outline-offset: 2px;
    padding: 0 0.3em;
    font-style: normal;
    font-weight: 600;
  }
  .needs-you-photo {
    display: grid;
    place-items: center;
    min-height: 12rem;
    padding: 1rem;
    text-align: center;
  }
  .skip-link { position: absolute; left: -999px; }
  .skip-link:focus { left: 1rem; top: 1rem; background: #fff; color: #000; padding: 0.5rem 1rem; z-index: 10; }
  img { max-width: 100%; height: auto; }
-->
