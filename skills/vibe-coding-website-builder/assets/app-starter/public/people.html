<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People - My app</title>
  <meta name="description" content="Add people to My app and manage what they can do.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="bar">
    <a class="brand" href="/">My app</a>
    <nav aria-label="Main" id="nav"></nav>
    <div class="who">
      <span id="who-name"></span>
      <button type="button" class="button quiet" id="sign-out">Sign out</button>
    </div>
  </header>

  <main id="main">
    <h1>People</h1>
    <p id="status" role="status" aria-live="polite"></p>

    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">Everyone with an account</caption>
        <thead>
          <tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Role</th><th scope="col">Can sign in</th><th scope="col">Password</th></tr>
        </thead>
        <tbody id="people"></tbody>
      </table>
    </div>

    <h2>Add someone</h2>
    <form id="add-form" class="narrow-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="off" maxlength="80" required>
        <p class="field-error" data-for="name"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="off" required>
        <p class="field-error" data-for="email"></p>
      </div>
      <div class="field">
        <label for="role">Role</label>
        <select id="role" name="role"></select>
        <p class="field-error" data-for="role"></p>
      </div>
      <div class="field">
        <label for="password">First password</label>
        <input id="password" name="password" type="text" autocomplete="off" required aria-describedby="password-hint">
        <p class="hint" id="password-hint">At least 8 characters. Give it to them privately and ask them to change it.</p>
        <p class="field-error" data-for="password"></p>
      </div>
      <p class="form-error" role="alert"></p>
      <button type="submit" class="button" id="add" data-busy="Adding…">Add person</button>
    </form>
  </main>

  <script type="module" src="/js/people.js"></script>
</body>
</html>
